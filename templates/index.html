<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
}

#map {
    position: absolute;
    inset: 0;
}


/* =========================================================
   HEADER
   ========================================================= */

#header {
    position: absolute;
    z-index: 20;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;

    background: rgba(12, 17, 22, 0.96);

    color: white;

    display: flex;
    align-items: center;

    padding: 0 14px;

    border-bottom: 1px solid #555;

    box-sizing: border-box;
}

#title {
    font-weight: bold;
    font-size: 17px;
}

#time {
    margin-left: auto;
    color: #ccc;
    font-size: 12px;
}


/* =========================================================
   CONTROL PANEL
   ========================================================= */

#controls {
    position: absolute;
    z-index: 20;

    left: 12px;
    top: 62px;

    width: 305px;

    padding: 12px;

    background: rgba(15, 20, 26, 0.95);

    border: 1px solid #56616c;
    border-radius: 6px;

    color: white;

    box-sizing: border-box;
}

.label {
    margin-top: 10px;
    margin-bottom: 5px;

    font-size: 11px;
    font-weight: bold;

    color: #aeb8c2;

    text-transform: uppercase;
}

.label:first-child {
    margin-top: 0;
}

select {
    width: 100%;

    padding: 7px;

    background: #252d35;

    color: white;

    border: 1px solid #56616c;
    border-radius: 4px;

    box-sizing: border-box;
}


/* =========================================================
   PRODUCT BUTTONS
   ========================================================= */

#products {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;
}

.product {
    padding: 8px 4px;

    border: 1px solid #596570;
    border-radius: 4px;

    background: #252d35;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.product:hover {
    background: #34404b;
}

.product.active {
    background: #1686d9;
    border-color: #59bfff;
}


/* =========================================================
   NORMAL BUTTONS
   ========================================================= */

.controlButton {
    padding: 8px;

    border: 1px solid #596570;
    border-radius: 4px;

    background: #252d35;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.controlButton:hover {
    background: #34404b;
}

.controlButton.active {
    background: #1686d9;
    border-color: #59bfff;
}


/* =========================================================
   SLIDERS
   ========================================================= */

#opacity,
#frameSlider {
    width: 100%;
}


/* =========================================================
   ANIMATION BUTTONS
   ========================================================= */

#animationButtons {
    display: flex;
    gap: 5px;
}

#animationButtons button {
    flex: 1;
}


/* =========================================================
   FRAME TIME
   ========================================================= */

#frameTime {
    text-align: center;

    margin-top: 4px;

    font-size: 11px;

    color: #ccc;
}


/* =========================================================
   CHECKBOXES
   ========================================================= */

.checkboxRow {
    margin-top: 8px;

    font-size: 12px;

    color: #ddd;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
    margin-top: 10px;

    padding: 7px;

    min-height: 28px;

    background: #090c10;

    border-radius: 4px;

    color: #ddd;

    font-size: 12px;

    line-height: 16px;
}


/* =========================================================
   LOADING
   ========================================================= */

#loading {
    display: none;

    position: absolute;

    z-index: 50;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    padding: 16px 24px;

    background: rgba(0, 0, 0, 0.88);

    border: 1px solid #777;
    border-radius: 6px;

    color: white;

    font-weight: bold;

    pointer-events: none;
}


/* =========================================================
   LEGEND
   ========================================================= */

#legend {
    position: absolute;

    z-index: 20;

    right: 12px;
    bottom: 25px;

    width: 330px;

    padding: 9px;

    background: rgba(15, 20, 26, 0.94);

    border: 1px solid #56616c;
    border-radius: 5px;

    color: white;

    box-sizing: border-box;
}

#legendTitle {
    font-size: 12px;
    font-weight: bold;

    margin-bottom: 6px;
}

#colorbar {
    height: 18px;

    border: 1px solid #777;
}

#legendLabels {
    display: flex;

    justify-content:
        space-between;

    font-size: 10px;

    margin-top: 3px;
}


/* =========================================================
   MAPBOX POPUP
   ========================================================= */

.mapboxgl-popup-content {
    background: #171d23;

    color: white;

    border: 1px solid #666;

    font-size: 12px;

    line-height: 18px;
}

.mapboxgl-popup-tip {
    border-top-color: #171d23 !important;
}

.mapboxgl-popup-close-button {
    color: white;
}


#siteSearch { width:100%; box-sizing:border-box; margin-bottom:6px; background:#111820; color:white; border:1px solid #59636d; border-radius:4px; padding:7px 8px; }
#site { width:100%; background:#111820; color:white; }
#nextUpdate { margin-top:6px; font-size:11px; color:#9fd3ff; }

/* =========================================================
   MOBILE
   ========================================================= */

@media
(max-width: 700px) {

    #controls {
        width: 270px;
    }

    #legend {
        width: 260px;
    }

}

async function loadElevations() {

    const response =
        await fetch(
            `/api/elevations/` +
            `${currentSite}/` +
            `${currentProduct}`
        );

    if (!response.ok) {
        throw new Error(
            `Elevation request failed: ${response.status}`
        );
    }

    const data =
        await response.json();

    if (!data.success) {
        throw new Error(
            data.error ||
            "Unable to load elevations."
        );
    }

    if (
        !Array.isArray(data.elevations)
        ||
        data.elevations.length === 0
    ) {
        throw new Error(
            `No ${currentProduct} elevations available.`
        );
    }

    const select =
        document.getElementById(
            "elevation"
        );

    const oldElevation =
        Number(
            currentElevation
        );

    select.innerHTML =
        "";

    data.elevations.forEach(
        elevation => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                elevation;

            option.textContent =
                Number(
                    elevation
                ).toFixed(2)
                +
                "°";

            select.appendChild(
                option
            );
        }
    );

    let closest =
        data.elevations[0];

    let closestDifference =
        Math.abs(
            closest -
            oldElevation
        );

    for (
        const elevation
        of data.elevations
    ) {

        const difference =
            Math.abs(
                elevation -
                oldElevation
            );

        if (
            difference <
            closestDifference
        ) {

            closest =
                elevation;

            closestDifference =
                difference;
        }
    }

    currentElevation =
        Number(
            closest
        );

    select.value =
        String(
            closest
        );
}

async function showAnimationFrame(
    frameIndex,
    showLoadingOverlay = false
) {

    if (
        frameIndex < 0
        ||
        frameIndex >=
            animationFrames.length
    ) {
        return;
    }

    currentFrameIndex =
        frameIndex;

    const frame =
        animationFrames[
            frameIndex
        ];

    document
        .getElementById(
            "frameSlider"
        )
        .value =
            frameIndex;

    updateFrameTime();

    const cacheId =
        frame.key
        +
        "|"
        +
        currentProduct
        +
        "|"
        +
        currentElevation;

    let data;

    try {

        if (
            showLoadingOverlay
        ) {
            setLoading(
                true,
                `Rendering ${currentSite} ` +
                `${currentProduct}...`
            );
        }

        if (
            frameMetadataCache.has(
                cacheId
            )
        ) {
            data =
                frameMetadataCache.get(
                    cacheId
                );
        }

        else {

            const url =
                `/api/frame-raster/` +
                `${currentSite}/` +
                `${currentProduct}/` +
                `${currentElevation}` +
                `?key=` +
                encodeURIComponent(
                    frame.key
                )
                +
                `&max_range_km=230`;

            const response =
                await fetch(
                    url
                );

            if (!response.ok) {
                throw new Error(
                    `Radar frame request failed: ` +
                    `${response.status}`
                );
            }

            data =
                await response.json();

            if (!data.success) {
                throw new Error(
                    data.error ||
                    "Radar frame failed."
                );
            }

            frameMetadataCache.set(
                cacheId,
                data
            );
        }

        await updateRadarImage(
            data
        );

        const actualElevation =
            Number(
                data.actual_elevation
            );

        setStatus(
            `${PRODUCTS[currentProduct].title} — ` +
            `${actualElevation.toFixed(2)}° — ` +
            `Frame ${frameIndex + 1} of ` +
            `${animationFrames.length}`
        );

        updateLegend();
    }

    catch (error) {

        console.error(
            error
        );

        setStatus(
            "Radar error: "
            +
            error.message
        );

        throw error;
    }

    finally {

        if (
            showLoadingOverlay
        ) {
            setLoading(
                false
            );
        }
    }
}


/* =========================================================

   ========================================================= */

async function preloadFrames() {

    if (
        !animationFrames.length
    ) {
        return;
    }

    setStatus(
        `Preparing ${animationFrames.length} ` +
        `${currentProduct} frames...`
    );

    for (
        let i = 0;
        i < animationFrames.length;
        i++
    ) {

        const frame =
            animationFrames[i];

        const cacheId =
            frame.key
            +
            "|"
            +
            currentProduct
            +
            "|"
            +
            currentElevation;

        if (
            frameMetadataCache.has(
                cacheId
            )
        ) {
            continue;
        }

        try {

            const url =
                `/api/frame-raster/` +
                `${currentSite}/` +
                `${currentProduct}/` +
                `${currentElevation}` +
                `?key=` +
                encodeURIComponent(
                    frame.key
                )
                +
                `&max_range_km=230`;

            const response =
                await fetch(
                    url
                );

            if (!response.ok) {
                continue;
            }

            const data =
                await response.json();

            if (
                data.success
            ) {

                frameMetadataCache.set(
                    cacheId,
                    data
                );

                const image =
                    new Image();

                image.src =
                    data.image_url;
            }
        }

        catch (error) {

            console.warn(
                "Unable to preload frame",
                i,
                error
            );
        }
    }

    setStatus(
        `${PRODUCTS[currentProduct].title} frames ready.`
    );
}

   ========================================================= */

function stopAnimation() {

    animationRunning =
        false;

    animationBusy =
        false;

    if (
        animationTimer
    ) {

        clearTimeout(
            animationTimer
        );

        animationTimer =
            null;
    }

    const button =
        document.getElementById(
            "loopButton"
        );

    button.textContent =
        "▶ Loop";

    button.classList.remove(
        "active"
    );
}


function scheduleNextFrame(
    delay
) {

    if (
        !animationRunning
    ) {
        return;
    }

    if (
        animationTimer
    ) {
        clearTimeout(
            animationTimer
        );
    }

    animationTimer =
        setTimeout(
            advanceAnimation,
            delay
        );
}


async function advanceAnimation() {

    if (
        !animationRunning
        ||
        animationBusy
    ) {
        return;
    }

    animationBusy =
        true;

    try {

        currentFrameIndex++;

        if (
            currentFrameIndex >=
            animationFrames.length
        ) {
            currentFrameIndex =
                0;
        }

        await showAnimationFrame(
            currentFrameIndex,
            false
        );

        const newest =
            currentFrameIndex ===
            animationFrames.length - 1;

        scheduleNextFrame(
            newest
            ?
            LATEST_FRAME_PAUSE
            :
            FRAME_INTERVAL
        );
    }

    catch (error) {

        console.error(
            error
        );

        scheduleNextFrame(
            1000
        );
    }

    finally {

        animationBusy =
            false;
    }
}

/* =========================================================
   GEODESIC CIRCLE
   ========================================================= */

function createCircle(
    centerLon,
    centerLat,
    radiusMiles,
    points = 180
) {

    const radiusKm =
        radiusMiles *
        1.609344;

    const earthRadiusKm =
        6371.0088;

    const angularDistance =
        radiusKm /
        earthRadiusKm;

    const lat1 =
        centerLat *
        Math.PI /
        180;

    const lon1 =
        centerLon *
        Math.PI /
        180;

    const coordinates =
        [];

    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const bearing =
            (
                i /
                points
            )
            *
            2
            *
            Math.PI;

        const lat2 =
            Math.asin(
                Math.sin(
                    lat1
                )
                *
                Math.cos(
                    angularDistance
                )
                +
                Math.cos(
                    lat1
                )
                *
                Math.sin(
                    angularDistance
                )
                *
                Math.cos(
                    bearing
                )
            );

        const lon2 =
            lon1
            +
            Math.atan2(
                Math.sin(
                    bearing
                )
                *
                Math.sin(
                    angularDistance
                )
                *
                Math.cos(
                    lat1
                ),

                Math.cos(
                    angularDistance
                )
                -
                Math.sin(
                    lat1
                )
                *
                Math.sin(
                    lat2
                )
            );

        coordinates.push(
            [
                lon2 *
                180 /
                Math.PI,

                lat2 *
                180 /
                Math.PI
            ]
        );
    }

    return coordinates;
}


/* =========================================================
   RANGE RINGS
   ========================================================= */

function updateRangeRings() {

    const enabled =
        document
            .getElementById(
                "rangeRings"
            )
            .checked;

    const distances = [
        25,
        50,
        75,
        100,
        125
    ];

    const features =
        [];

    if (
        enabled
    ) {

        distances.forEach(
            miles => {

                features.push(
                    {
                        type:
                            "Feature",

                        properties: {
                            miles:
                                miles
                        },

                        geometry: {
                            type:
                                "LineString",

                            coordinates:
                                createCircle(
                                    radarLon,
                                    radarLat,
                                    miles
                                )
                        }
                    }
                );
            }
        );
    }

    const geojson = {

        type:
            "FeatureCollection",

        features:
            features
    };

    if (
        map.getSource(
            "range-rings"
        )
    ) {

        map
            .getSource(
                "range-rings"
            )
            .setData(
                geojson
            );

        return;
    }

    map.addSource(
        "range-rings",
        {
            type:
                "geojson",

            data:
                geojson
        }
    );

    map.addLayer(
        {
            id:
                "range-rings",

            type:
                "line",

            source:
                "range-rings",

            paint: {

                "line-color":
                    "#ffffff",

                "line-width":
                    1,

                "line-opacity":
                    0.45,

                "line-dasharray": [
                    4,
                    4
                ]
            }
        },

        map.getLayer(
            "radar-site-dot"
        )
        ?
        "radar-site-dot"
        :
        undefined
    );
}


/* =========================================================
   RANGE RING TOGGLE
   ========================================================= */

document
    .getElementById(
        "rangeRings"
    )
    .addEventListener(
        "change",
        () => {
            updateRangeRings();
        }
    );


/* =========================================================
   EXACT DATA INTERROGATION
   ========================================================= */

map.on(
    "click",
    async event => {

        if (
            !document
                .getElementById(
                    "interrogate"
                )
                .checked
        ) {
            return;
        }

        if (
            !animationFrames.length
        ) {
            return;
        }

        const lat =
            event.lngLat.lat;

        const lon =
            event.lngLat.lng;

        const frame =
            animationFrames[
                currentFrameIndex
            ];

        try {

            let url =
                `/api/query/` +
                `${currentSite}/` +
                `${currentProduct}/` +
                `${currentElevation}` +
                `?lat=${lat}` +
                `&lon=${lon}`;

            if (
                frame &&
                frame.key
            ) {

                url +=
                    `&key=`
                    +
                    encodeURIComponent(
                        frame.key
                    );
            }

            const response =
                await fetch(
                    url
                );

            if (!response.ok) {
                throw new Error(
                    `Query failed: ${response.status}`
                );
            }

            const data =
                await response.json();

            if (
                !data.success
            ) {
                throw new Error(
                    data.error ||
                    "No radar data."
                );
            }

            let valueText =
                "No Data";

            if (
                data.value !== null
                &&
                data.value !== undefined
            ) {

                valueText =
                    Number(
                        data.value
                    ).toFixed(1)
                    +
                    (
                        data.units
                        ?
                        " " + data.units
                        :
                        ""
                    );
            }

            let frameText =
                "";

            if (
                frame &&
                frame.time
            ) {

                frameText =
                    "<br>Scan: "
                    +
                    new Date(
                        frame.time
                    ).toLocaleString();
            }

            const html = `

                <strong>
                    ${data.site}
                    ${data.product_name}
                </strong>

                <br>

                Value:
                <b>
                    ${valueText}
                </b>

                <br>

                Elevation:
                ${Number(
                    data.elevation
                ).toFixed(2)}°

                <br>

                Range:
                ${Number(
                    data.range_mi
                ).toFixed(1)} mi

                <br>

                Azimuth:
                ${Number(
                    data.azimuth
                ).toFixed(1)}°

                ${frameText}

            `;

            if (
                currentPopup
            ) {
                currentPopup.remove();
            }

            currentPopup =
                new mapboxgl.Popup({
                    closeButton:
                        true,

                    closeOnClick:
                        true
                })
                .setLngLat(
                    event.lngLat
                )
                .setHTML(
                    html
                )
                .addTo(
                    map
                );
        }

        catch (error) {

            console.error(
                error
            );
        }
    }
);/* =========================================================
   SEARCHABLE CONUS RADAR SELECTOR
   ========================================================= */
const originalRadarOptions=Array.from(document.querySelectorAll("#site option")).map(o=>({value:o.value,text:o.textContent.trim(),search:(o.dataset.search||o.textContent).toLowerCase(),state:o.parentElement?.tagName==="OPTGROUP"?o.parentElement.label:"Other"}));
function rebuildRadarSelector(filterText=""){ const select=document.getElementById("site"),q=filterText.trim().toLowerCase(),groups=new Map(); for(const item of originalRadarOptions){if(q&&!item.search.includes(q))continue;if(!groups.has(item.state))groups.set(item.state,[]);groups.get(item.state).push(item);} select.innerHTML=""; for(const [state,items] of groups){const group=document.createElement("optgroup");group.label=state;for(const item of items){const o=document.createElement("option");o.value=item.value;o.textContent=item.text;o.dataset.search=item.search;if(item.value===currentSite)o.selected=true;group.appendChild(o);}select.appendChild(group);} }
document.getElementById("siteSearch").addEventListener("input",e=>rebuildRadarSelector(e.target.value));

/* =========================================================
   RADAR SITE CHANGE
   ========================================================= */

document
    .getElementById(
        "site"
    )
    .addEventListener(
        "change",
        async event => {

            stopAnimation();

            currentSite =
                event.target.value;

            resetLiveCountdown();
            updateLiveCountdown();

            frameMetadataCache.clear();

            setLoading(
                true,
                `Loading ${currentSite}...`
            );

            try {

                await loadElevations();

                await loadFrameList();

                await showAnimationFrame(
                    animationFrames.length - 1,
                    false
                );

                map.easeTo({
                    center: [
                        radarLon,
                        radarLat
                    ],

                    zoom:
                        6.3,

                    duration:
                        700
                });
            }

            catch (error) {

                console.error(
                    error
                );

                setStatus(
                    "Radar site error: "
                    +
                    error.message
                );
            }

            finally {

                setLoading(
                    false
                );
            }
        }
    );


/* =========================================================
   60-SECOND LIVE AUTO UPDATE

   Every 60 seconds this asks app.py to FORCE a fresh check
   of the AWS NEXRAD Level-II archive.

   If a new scan exists:
     - refresh the 10-frame list
     - automatically display it when viewing Latest
     - preserve an old frame if the user is reviewing history
     - allow the animation loop to continue
   ========================================================= */

function isViewingLatestFrame() {

    return (
        animationFrames.length > 0
        &&
        currentFrameIndex ===
            animationFrames.length - 1
    );
}


async function checkForNewRadarData() {

    if (
        liveUpdateBusy
    ) {
        return;
    }

    liveUpdateBusy =
        true;

    const wasViewingLatest =
        isViewingLatestFrame();

    const wasAnimating =
        animationRunning;

    const oldCurrentKey =
        animationFrames.length
        &&
        animationFrames[
            currentFrameIndex
        ]
        ?
        animationFrames[
            currentFrameIndex
        ].key
        :
        null;

    try {

        console.log(
            `Checking AWS for new ${currentSite} radar data...`
        );

        const response =
            await fetch(
                `/api/frames/${currentSite}?refresh=1&count=${animationRunning ? 10 : 1}`,
                {
                    cache:
                        "no-store"
                }
            );

        if (
            !response.ok
        ) {

            throw new Error(
                `Live frame request failed: ` +
                `${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            !data.success
            ||
            !Array.isArray(
                data.frames
            )
            ||
            data.frames.length === 0
        ) {

            throw new Error(
                data.error
                ||
                "No radar frames returned during live update."
            );
        }

        const refreshedFrames =
            data.frames;

        const newestFrame =
            refreshedFrames[
                refreshedFrames.length - 1
            ];

        const previousLatestKey =
            lastKnownLatestKey
            ||
            (
                animationFrames.length
                ?
                animationFrames[
                    animationFrames.length - 1
                ].key
                :
                null
            );

        const newScanAvailable =
            previousLatestKey
            &&
            newestFrame.key !==
                previousLatestKey;

        animationFrames =
            refreshedFrames;

        lastKnownLatestKey =
            newestFrame.key;

        const slider =
            document.getElementById(
                "frameSlider"
            );

        slider.min =
            0;

        slider.max =
            Math.max(
                0,
                animationFrames.length - 1
            );

        /*
         * NEW RADAR VOLUME FOUND
         */

        if (
            newScanAvailable
        ) {

            console.log(
                "New NEXRAD Level-II scan detected:",
                newestFrame.filename
                ||
                newestFrame.key
            );

            /*
             * If the viewer was already watching Latest,
             * automatically move to the new scan.
             */

            if (
                wasViewingLatest
                &&
                !wasAnimating
            ) {

                currentFrameIndex =
                    animationFrames.length - 1;

                slider.value =
                    currentFrameIndex;

                setStatus(
                    `New ${currentSite} scan found — ` +
                    `loading ` +
                    `${PRODUCTS[currentProduct].title}...`
                );

                await showAnimationFrame(
                    currentFrameIndex,
                    false
                );
            }

            else {

                /*
                 * User is looking at an older frame.
                 * Try to preserve that exact archive key.
                 */

                let preservedIndex =
                    oldCurrentKey
                    ?
                    animationFrames.findIndex(
                        frame =>
                            frame.key ===
                            oldCurrentKey
                    )
                    :
                    -1;

                if (
                    preservedIndex < 0
                ) {

                    preservedIndex =
                        Math.min(
                            currentFrameIndex,
                            animationFrames.length - 1
                        );
                }

                currentFrameIndex =
                    preservedIndex;

                slider.value =
                    currentFrameIndex;

                updateFrameTime();

                if (
                    wasAnimating
                ) {

                    setStatus(
                        `New ${currentSite} scan ` +
                        `added to animation.`
                    );
                }

                else {

                    setStatus(
                        `New ${currentSite} scan available — ` +
                        `press Latest to view it.`
                    );
                }
            }
        }

        /*
         * NO NEW SCAN
         */

        else {

            if (
                wasViewingLatest
            ) {

                currentFrameIndex =
                    animationFrames.length - 1;

                slider.value =
                    currentFrameIndex;

                updateFrameTime();
            }

            console.log(
                `Live radar check complete — ` +
                `no new ${currentSite} scan.`
            );
        }
    }

    catch (error) {

        console.error(
            "Live radar update error:",
            error
        );

        /*
         * Do NOT remove the existing radar if an update
         * check fails. It will simply retry in 60 seconds.
         */
    }

    finally {

        liveUpdateBusy =
            false;

        resetLiveCountdown();
        updateLiveCountdown();
    }
}


function resetLiveCountdown(){ nextLiveCheckAt=Date.now()+LIVE_UPDATE_INTERVAL; }
function updateLiveCountdown(){ const e=document.getElementById("nextUpdate"); if(!e)return; const r=Math.max(0,Math.ceil((nextLiveCheckAt-Date.now())/1000)); e.textContent=`Next ${currentSite} radar check in ${r}s`; }
function startCountdownClock(){ if(countdownTimer)clearInterval(countdownTimer); resetLiveCountdown(); updateLiveCountdown(); countdownTimer=setInterval(updateLiveCountdown,250); }

/* =========================================================
   START LIVE UPDATE TIMER
   ========================================================= */

function startLiveUpdates() {

    /*
     * Prevent duplicate timers.
     */

    if (
        liveUpdateTimer
    ) {

        clearInterval(
            liveUpdateTimer
        );
    }

    /*
     * Remember the scan currently considered Latest.
     */

    if (
        animationFrames.length
    ) {

        lastKnownLatestKey =
            animationFrames[
                animationFrames.length - 1
            ].key;
    }

    /*
     * Check once every 60,000 milliseconds = 60 seconds.
     */

    liveUpdateTimer =
        setInterval(
            checkForNewRadarData,
            LIVE_UPDATE_INTERVAL
        );

    startCountdownClock();

    console.log(
        "NEXRAD live auto-update enabled: 60 seconds"
    );
}/* =========================================================
   INITIALIZE
   ========================================================= */

map.on(
    "load",
    async () => {

        setLoading(
            true,
            "Connecting to NEXRAD backend..."
        );

        try {

            await checkBackend();

            updateLegend();

            setLoading(
                true,
                `Finding latest ${currentSite} volume...`
            );

            await loadElevations();

            await loadFrameList();

            setLoading(
                true,
                `Rendering latest ${currentSite} ` +
                `${currentProduct}...`
            );

            await showAnimationFrame(
                animationFrames.length - 1,
                false
            );


            /*
             * =====================================================
             * START THE 60-SECOND AUTOMATIC RADAR UPDATE
             * =====================================================
             */

            startLiveUpdates();


            map.easeTo({

                center: [
                    radarLon,
                    radarLat
                ],

                zoom:
                    6.3,

                duration:
                    700
            });


            /* Older nine frames load only when Loop is pressed. */
        }

        catch (error) {

            console.error(
                error
            );

            setStatus(
                "Startup error: "
                +
                error.message
            );
        }

        finally {

            setLoading(
                false
            );
        }
    }
);
